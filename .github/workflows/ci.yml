name: CI

# Pull requests and branches. A push to main is tested by deploy.yml, which runs
# the same checks before publishing to GitHub Pages.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Playwright's image has the Chromium build the pinned @playwright/test expects;
    # WebGPU runs on SwiftShader, so the WGSL kernels are tested without a GPU.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright test --trace off
      - run: npm run build

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
